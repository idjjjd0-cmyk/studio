<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>Форма — CRM для тренера</title>
<script>try { var th = null; try { th = localStorage.getItem('forma.theme'); } catch (e) {} var qt = location.search.match(/[?&]theme=(dark|light)/); if (qt) th = qt[1]; document.documentElement.dataset.theme = th || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}</script>
<!--
  Мини-приложение Telegram для фитнес-тренера: клиенты, абонементы, расписание, деньги.
  Сейчас это шаблон с выдуманными данными: правки (списание занятия, новый клиент, продление)
  сохраняются в браузере. Сервер и бота подключим следующим этапом.
-->
<style>
/* Палитра: спокойный небесно-бирюзовый акцент (энергия без агрессии), зелёный — «сделано».
   Тёмная и светлая тема подхватываются из системы или из Telegram. Материал карточек — «жидкое стекло». */
:root {
  color-scheme: dark;
  --bg: #080b10; --text: #f3f6fa; --sec: #98a3b3; --ter: #647083;
  --card: rgba(255,255,255,.065); --card2: rgba(255,255,255,.11); --bar: rgba(255,255,255,.12); --sep: rgba(255,255,255,.08);
  --glass: rgba(22,28,38,.5); --glass2: rgba(30,37,49,.66); --glass-b: rgba(255,255,255,.11); --hi: rgba(255,255,255,.2); --sh: rgba(0,0,0,.32);
  --sheet: rgba(16,21,29,.78); --hov: rgba(255,255,255,.04); --scrim: rgba(2,5,10,.5);
  --acc: #40c8f0; --acc2: #8fe4ff; --acc-a: rgba(64,200,240,.16); --acc-b: rgba(64,200,240,.3); --onAcc: #022029;
  --ok: #5ee38f; --ok-a: rgba(94,227,143,.15); --warn: #ffc53d; --warn-a: rgba(255,197,61,.15); --bad: #ff6b7a; --bad-a: rgba(255,107,122,.15);
  --glow1: rgba(64,200,240,.22); --glow2: rgba(94,227,143,.11); --glow3: rgba(120,110,255,.10);
  --hero: linear-gradient(150deg, rgba(64,200,240,.17), rgba(22,28,38,.45) 62%); --glare: rgba(255,255,255,.075);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --blur: blur(26px) saturate(180%);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf1f6; --text: #0c1522; --sec: #556175; --ter: #8a95a6;
  --card: rgba(15,30,55,.055); --card2: rgba(15,30,55,.09); --bar: rgba(15,30,55,.1); --sep: rgba(15,30,55,.08);
  --glass: rgba(255,255,255,.56); --glass2: rgba(255,255,255,.76); --glass-b: rgba(255,255,255,.85); --hi: rgba(255,255,255,.95); --sh: rgba(40,60,95,.13);
  --sheet: rgba(245,248,252,.84); --hov: rgba(15,30,55,.035); --scrim: rgba(20,30,45,.22);
  --acc: #0a84c2; --acc2: #2aa8e4; --acc-a: rgba(10,132,194,.12); --acc-b: rgba(10,132,194,.24); --onAcc: #fff;
  --ok: #129a59; --ok-a: rgba(18,154,89,.12); --warn: #b77700; --warn-a: rgba(200,130,0,.13); --bad: #d8384c; --bad-a: rgba(216,56,76,.11);
  --glow1: rgba(10,132,194,.2); --glow2: rgba(40,200,140,.16); --glow3: rgba(120,110,255,.12);
  --hero: linear-gradient(150deg, rgba(10,132,194,.13), rgba(255,255,255,.55) 62%); --glare: rgba(255,255,255,.75);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  font: 15px/1.4 var(--font); color: var(--text); background: var(--bg); min-height: 100dvh;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.005em;
  overscroll-behavior-y: none; padding-bottom: calc(96px + env(safe-area-inset-bottom));
  transition: background-color .4s ease, color .4s ease;
}
/* неподвижный цветной фон: стеклу есть что преломлять, но ничего не мельтешит */
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(42% 34% at 88% 4%, var(--glow1), transparent 70%), radial-gradient(38% 30% at 6% 38%, var(--glow2), transparent 70%), radial-gradient(40% 30% at 70% 92%, var(--glow3), transparent 70%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; }
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 16px; }
.view { display: none; }
.view.on { display: block; animation: enter .55s var(--ease); }
.view.on.fr { animation: vR .5s var(--ease); } .view.on.fl { animation: vL .5s var(--ease); }
@keyframes vR { from { opacity: 0; transform: translateX(16px); } } @keyframes vL { from { opacity: 0; transform: translateX(-16px); } }
/* каскад: блоки всплывают по очереди и проступают из размытия, как стекло из тумана */
.rv { animation: rv .65s var(--ease) both; animation-delay: calc(var(--d, 0) * 55ms); }
@keyframes rv { from { opacity: 0; transform: translateY(18px) scale(.98); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.rv .row { animation-delay: calc(var(--d, 0) * 55ms + 120ms + var(--k, 0) * 35ms); }
.view.calm .rv, .view.calm .row, .view.calm .bar i, .view.calm .chart .col .b { animation: none; }
.sr { animation: inR .42s var(--ease) both !important; } .sl { animation: inL .42s var(--ease) both !important; }
@keyframes inR { from { opacity: 0; transform: translateX(28px); } } @keyframes inL { from { opacity: 0; transform: translateX(-28px); } }
@keyframes drawIn { from { stroke-dashoffset: 1; } }
@keyframes fadeIn { from { opacity: 0; } }
main { transition: transform .55s cubic-bezier(.32, .72, 0, 1); }
body.sheet-open main { transform: scale(.94); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* жидкое стекло: полупрозрачный слой, размытие и насыщение фона, светлая кромка сверху */
.list, .stat { position: relative; }
.list, .card, .stat, .search {
  background-color: var(--glass); background-image: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,0) 42%);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-b); box-shadow: inset 0 1px 0 var(--hi), 0 10px 30px -12px var(--sh);
}

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(22px + env(safe-area-inset-top)) 2px 16px; }
.large { font: 700 32px/1.08 var(--round); letter-spacing: -.028em; }
.sub { color: var(--sec); font-size: 14px; margin-top: 3px; letter-spacing: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--sec); padding: 26px 4px 9px; letter-spacing: .005em; }
.sec-h b { font: 600 18px/1.2 var(--round); color: var(--text); letter-spacing: -.015em; }
.foot { font-size: 12px; color: var(--ter); padding: 10px 4px 0; line-height: 1.4; letter-spacing: .01em; }

.press { transition: transform .16s var(--ease), background-color .2s; }
.press:active { transform: scale(.97); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--glass2); border: 1px solid var(--glass-b); box-shadow: inset 0 1px 0 var(--hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border-radius: 13px; font-weight: 600; font-size: 14px; background: var(--card2); }
.btn.pri { background: linear-gradient(180deg, var(--acc2) -40%, var(--acc)); color: var(--onAcc); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px -6px var(--acc-b); }
.btn.ok { background: var(--ok-a); color: var(--ok); }
.btn.bad { background: var(--bad-a); color: var(--bad); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 11px; }
.icon-btn.lbl { width: auto; border-radius: 99px; padding: 0 14px 0 11px; gap: 6px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; white-space: nowrap; }
.icon-btn.lbl svg, .icon-btn.lbl .ic { width: 18px; height: 18px; }
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 2px; }
.qa.two { grid-template-columns: repeat(2, 1fr); }
.qa > * { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 64px; padding: 10px 4px 8px; border-radius: 15px; background: var(--card2); color: var(--text); font-size: 12px; font-weight: 600; text-decoration: none; }
.qa > * .ic { width: 20px; height: 20px; color: var(--acc); }
.attn { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 12px; padding: 12px 14px; border-radius: 16px; background: var(--warn-a); color: var(--warn); font-weight: 600; font-size: 14px; text-align: left; }
.attn b { margin-left: auto; font-size: 18px; line-height: 1; }
details.blk > summary { list-style: none; cursor: pointer; } details.blk > summary::-webkit-details-marker { display: none; }
details.blk > summary h4 { margin: 0; } details.blk[open] > summary h4 { margin-bottom: 10px; }
details.blk > summary h4 span::after { content: ' ›'; display: inline-block; transition: transform .2s var(--ease); } details.blk[open] > summary h4 span::after { transform: rotate(90deg); }
.row.free { color: var(--sec); } .row.free .tm { color: var(--acc); font-weight: 600; } .row.free .mid .nm { color: var(--sec); font-weight: 500; }
.archlink { display: block; width: 100%; text-align: center; margin-top: 10px; padding: 12px; color: var(--acc); font-weight: 600; font-size: 14px; }
.btn.wide { width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 15px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

.card { border-radius: 22px; padding: 16px; position: relative; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-radius: 20px; padding: 13px 13px 12px; min-width: 0; }
.stat .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sec); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gl { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--card2); color: var(--sec); }
.gl svg { width: 13px; height: 13px; }
.stat.acc .gl { background: var(--acc-a); color: var(--acc); }
.stat .num { font: 700 24px/1.15 var(--round); letter-spacing: -.03em; margin-top: 8px; white-space: nowrap; }
.stat .num small { font-size: 13px; font-weight: 600; color: var(--sec); margin-left: 2px; }
.stat.acc .num { color: var(--acc); }
.hero-card { padding: 18px 18px 18px 20px; background-image: var(--hero); border-color: var(--acc-b); }
.hero-card { overflow: hidden; }
.hero-card > * { position: relative; z-index: 1; }
.hero-card::before { content: ""; position: absolute; width: 75%; aspect-ratio: 1; right: -20%; top: -55%; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, var(--acc-b), transparent); animation: drift 18s ease-in-out infinite alternate; }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-35%, 30%) scale(1.2); } 100% { transform: translate(-70%, 8%) scale(.9); } }
.hero-card.split { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.hero-card .label { color: var(--sec); font-size: 13px; }
.hero-n { font: 700 48px/1 var(--round); letter-spacing: -.04em; margin-top: 6px; }
.hero-n small { font: 500 16px/1 var(--font); color: var(--sec); letter-spacing: 0; margin-left: 6px; }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring .tr { stroke: var(--bar); }
.ring .pr { stroke: url(#rg); animation: ring 1.1s var(--ease) both; }
@keyframes ring { from { stroke-dasharray: var(--from, 0) 240; } }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 19px/1 var(--round); letter-spacing: -.02em; }
.ring b small { display: block; font: 600 10px/1 var(--font); color: var(--sec); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; text-align: center; }

.list { border-radius: 22px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; position: relative; animation: enter .5s var(--ease) both; animation-delay: calc(var(--k, 0) * 35ms); }
.row + .row::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--sep); }
.row .tm { position: relative; width: 48px; flex: none; font: 600 15px/1.2 var(--round); letter-spacing: -.01em; }
.row .tm small { display: block; font: 500 11px/1.3 var(--font); color: var(--ter); }
.row .mid { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.row .ds { font-size: 13px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .end { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row.dim { opacity: .5; }
.row.is-live { background: linear-gradient(90deg, var(--acc-a), transparent 70%); }
.tm .live { position: absolute; left: -10px; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); animation: live 1.8s ease-out infinite; }
@keyframes live { from { box-shadow: 0 0 0 0 var(--acc-b); } to { box-shadow: 0 0 0 8px transparent; } }
.soon { color: var(--acc); font-weight: 600; }
/* отметка «пришёл»: кружок пружинит, галочка прорисовывается, по строке проходит волна */
.row.pop .chk { animation: chkpop .55s cubic-bezier(.34, 1.56, .64, 1); }
.row.pop .chk path { stroke-dasharray: 1; animation: drawIn .35s .12s cubic-bezier(.65, 0, .35, 1) both; }
.row.pop::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 200% at 100% 50%, var(--ok-a), transparent 65%); transform-origin: right; animation: wave .9s var(--ease) forwards; }
@keyframes chkpop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes wave { 0% { opacity: 0; transform: scaleX(.2); } 30% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1); } }
.row.empty { color: var(--sec); justify-content: center; padding: 22px; font-size: 14px; }
.row .acts { display: flex; gap: 6px; }

.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 14px/1 var(--round); color: #fff; letter-spacing: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.av.lg { width: 58px; height: 58px; font-size: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--card2); color: var(--sec); white-space: nowrap; }
.chip.ok { background: var(--ok-a); color: var(--ok); } .chip.warn { background: var(--warn-a); color: var(--warn); }
.chip.bad { background: var(--bad-a); color: var(--bad); } .chip.acc { background: var(--acc-a); color: var(--acc); }
.chk::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; }   /* область нажатия 46 px */
.chk { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--bar); display: grid; place-items: center; flex: none; transition: background-color .25s var(--ease), border-color .25s var(--ease), transform .16s var(--ease); }
.chk svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.6); transition: opacity .25s var(--ease), transform .3s var(--ease); }
@media (hover: hover) and (pointer: fine) { .chk:hover { border-color: var(--ok); } }
.row.is-done .chk { background: var(--ok); border-color: var(--ok); }
.row.is-done .chk svg { opacity: 1; transform: none; }
.row.is-cancel .nm, .row.is-miss .nm { text-decoration: line-through; color: var(--sec); }
.bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--acc2), var(--acc)); transform-origin: left; animation: grow .9s var(--ease) both; }
.bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); } .bar.ok i { background: var(--ok); }
@keyframes grow { from { transform: scaleX(0); } }
.mini { width: 64px; }

/* расписание */
.weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.weeknav .ttl { flex: 1; font: 600 16px/1.2 var(--round); text-align: center; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.dchip { padding: 8px 0 7px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-b); box-shadow: inset 0 1px 0 var(--hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); text-align: center; position: relative; transition: background-color .2s, transform .16s var(--ease); }
.dchip:active { transform: scale(.95); }
.dchip small { display: block; font-size: 11px; color: var(--sec); text-transform: uppercase; letter-spacing: .05em; }
.dchip b { display: block; font: 700 18px/1.2 var(--round); margin-top: 1px; }
.dchip em { display: block; height: 4px; margin: 5px auto 0; width: 4px; border-radius: 50%; background: transparent; font-style: normal; }
.dchip.has em { background: var(--sec); }
.dchip.on { background: linear-gradient(180deg, var(--acc2) -40%, var(--acc)); border-color: transparent; color: var(--onAcc); } .dchip.on small { color: inherit; opacity: .75; } .dchip.on.has em { background: var(--onAcc); }
.dchip.today:not(.on) b { color: var(--acc); }

/* клиенты */
.search { display: flex; align-items: center; gap: 8px; border-radius: 14px; padding: 0 12px; margin-bottom: 10px; }
.search svg { width: 17px; height: 17px; stroke: var(--sec); fill: none; stroke-width: 2.2; stroke-linecap: round; flex: none; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 11px 0; font-size: 16px; }
.search input::placeholder { color: var(--ter); }
.filters { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; padding: 7px 13px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-b); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); font-size: 13px; font-weight: 600; color: var(--sec); transition: background-color .2s, color .2s; }
.filters button.on { background: var(--text); color: var(--bg); border-color: transparent; }
.filters button i { font-style: normal; opacity: .6; margin-left: 4px; }

/* деньги и статистика */
.chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 14px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
.chart .col .v { font-size: 11px; color: var(--sec); white-space: nowrap; }
.chart .col .b { width: 100%; border-radius: 9px 9px 5px 5px; background: var(--bar); transform-origin: bottom; animation: rise .8s var(--ease) both; animation-delay: calc(var(--k) * 60ms); min-height: 4px; }
.chart .col.cur .b { background: linear-gradient(var(--acc2), var(--acc)); box-shadow: 0 6px 18px -6px var(--acc-b); }
.chart .col .l { font-size: 12px; color: var(--sec); }
@keyframes rise { from { transform: scaleY(0); } }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; }
.kv + .kv { border-top: 1px solid var(--sep); }
.kv span:first-child { color: var(--sec); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.delta { font-size: 13px; font-weight: 600; } .delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.top + .top { border-top: 1px solid var(--sep); }
.top .n { width: 20px; color: var(--ter); font: 700 15px/1 var(--round); }
.top .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

/* панель вкладок: плавающая стеклянная капсула, выбранная вкладка — стеклянная «линза», которая переезжает */
.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
.tabs .in { position: relative; display: flex; width: 100%; max-width: 520px; padding: 5px; border-radius: 28px; pointer-events: auto;

  border: 1px solid var(--glass-b); box-shadow: inset 0 1px 0 var(--hi), 0 16px 40px -10px var(--sh), 0 2px 8px -2px var(--sh); }

.tabs button.on { color: var(--acc); }

.tabs button.on svg { animation: tabpop .5s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes tabpop { 0% { transform: scale(.8); } 50% { transform: scale(1.14) translateY(-2px); } 100% { transform: none; } }
.theme-btn svg { animation: spin .55s cubic-bezier(.34, 1.56, .64, 1); }

/* шторка: толще и плотнее остального стекла, затемнение фона мягкое */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 90dvh; display: flex; flex-direction: column;
  background: var(--sheet); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
  border-radius: 30px 30px 0 0; border: 1px solid var(--glass-b); border-bottom: 0; box-shadow: inset 0 1px 0 var(--hi), 0 -20px 60px -20px var(--sh);
  transform: translateY(105%); transition: transform .5s cubic-bezier(.32, .72, 0, 1); will-change: transform; }
.sheet.on { transform: none; }
.sheet.drag { transition: none; }
.grab { padding: 10px 0 4px; cursor: grab; touch-action: none; flex: none; }
.grab::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--bar); margin: 0 auto; }
.sbody.enter > * { animation: rv .55s var(--ease) both; animation-delay: calc(var(--d, 0) * 45ms + 60ms); }
.sbody:not(.enter) .bar i, .sbody:not(.enter) .wl, .sbody:not(.enter) .wa, .sbody:not(.enter) .wd { animation: none; }
.wl { stroke-dasharray: 1; animation: drawIn 1.3s var(--ease) .25s both; }
.wa { animation: fadeIn .9s ease .6s both; }
.wd { transform-box: fill-box; transform-origin: center; animation: chkpop .5s 1.2s cubic-bezier(.34, 1.56, .64, 1) both; }
.sbody { overflow-y: auto; padding: 4px 18px calc(24px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 24px; }
.back { color: var(--acc); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 2px; padding: 4px 0; }
.stitle { font: 700 24px/1.15 var(--round); letter-spacing: -.025em; }
.shead { display: flex; align-items: center; gap: 14px; margin: 4px 0 14px; }
.shead .nm { font: 700 23px/1.15 var(--round); letter-spacing: -.025em; }
.shead .ds { color: var(--sec); font-size: 14px; margin-top: 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btns .btn { flex: 1 1 auto; }
.blk { background: var(--card); border: 1px solid var(--sep); border-radius: 20px; padding: 14px; margin-top: 12px; }
.blk > h4 { font-size: 13px; font-weight: 600; color: var(--sec); letter-spacing: .01em; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.blk.warn { background: var(--warn-a); border-color: transparent; } .blk.warn > h4 { color: var(--warn); }
.fld { display: block; margin-top: 12px; }
.fld > span { display: block; font-size: 13px; color: var(--sec); margin-bottom: 5px; }
.fld input, .fld select, .fld textarea { width: 100%; background: var(--card); border: 1px solid var(--sep); border-radius: 13px; padding: 12px 13px; font-size: 16px; outline: 0; transition: border-color .2s, box-shadow .2s; appearance: none; -webkit-appearance: none; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-a); }
.fld textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { padding: 9px 13px; border-radius: 13px; background: var(--card); border: 1px solid var(--sep); font-size: 14px; font-weight: 600; color: var(--sec); transition: background-color .2s, color .2s; text-align: center; }
.pick button.on { background: var(--acc); border-color: transparent; color: var(--onAcc); }
.pick.kinds { flex-direction: column; } .pick.kinds button { display: flex; justify-content: space-between; text-align: left; }
.msg { background: var(--card); border: 1px solid var(--sep); border-radius: 18px 18px 18px 6px; padding: 14px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px) scale(.96); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 20px;
  background: var(--glass2); -webkit-backdrop-filter: blur(30px) saturate(200%); backdrop-filter: blur(30px) saturate(200%); border: 1px solid var(--glass-b);
  font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); transition: opacity .35s var(--ease), transform .45s var(--ease); box-shadow: inset 0 1px 0 var(--hi), 0 14px 40px -10px var(--sh); }

.toast button { color: var(--acc); font-weight: 700; flex: none; }
.wchart { width: 100%; height: 86px; display: block; }
.hist { display: flex; flex-direction: column; }
.hist div { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px; }
.hist > * + * { border-top: 1px solid var(--sep); }
.hist button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 0; font-size: 14px; text-align: left; }
.hist span:first-child { color: var(--sec); }
.hist b { text-align: right; font-weight: 600; font-size: 13px; }
/* всё, что нажимается и ведёт к подробностям */
button.stat, button.kv, button.blk, .chart button.col { font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.stat { width: 100%; transition: transform .16s var(--ease); } button.stat:active, .hero-card.press:active { transform: scale(.97); }
button.kv { display: flex; width: 100%; } button.kv.lg b { color: var(--text); } button.kv small { color: var(--sec); font-weight: 600; margin-left: 4px; }
button.blk { display: block; width: 100%; }
.chart.tap .col { background: none; border: 0; padding: 0; border-radius: 10px; transition: transform .16s var(--ease); }

@media (hover: hover) and (pointer: fine) { .chart.tap .col:hover:not(.cur) .b { background: var(--acc-b); } button.kv:hover b, .hist button:hover span { color: var(--acc); } }

.stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1024px) { main .stats4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.mix { display: flex; gap: 3px; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
.mix i { display: block; height: 100%; transform-origin: left; animation: grow .9s var(--ease) both; }
.dot2 { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }
.n-rank { width: 18px; flex: none; color: var(--ter); font: 700 14px/1 var(--round); }
.row.more { justify-content: center; color: var(--acc); font-weight: 600; font-size: 14px; }
.setchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.setchips span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 10px; background: var(--card2); font: 600 13px/1 var(--round); color: var(--text); }
.setchips small { font: 600 10px/1 var(--font); color: var(--ter); }
.setchips span.rec { background: var(--ok-a); color: var(--ok); }
.lastw { font-size: 12.5px; color: var(--sec); margin-top: 3px; } .lastw b { color: var(--text); font-weight: 600; } .lastw .delta { font-size: 12px; }
.tapx { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .tapx:hover { background: var(--hov); } }
.sbody .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* смена темы: волна цвета (transform — плавно на любом телефоне), потом проявление */
.fatal-box { text-align: center; padding: 30vh 24px 0; }
body.fatal .tabs { display: none; }
.spin { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--bar); border-top-color: var(--acc); animation: spin2 .8s linear infinite; }
@keyframes spin2 { to { transform: rotate(360deg); } }
/* заставка при входе (как у WHOOP): тёмно-синий экран, кольцо крутится, пока грузятся данные, сжимается в линию, из-за линии поднимается FITNESS, под линией CLUB, над ними пружинит эмблема F */
#splash { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: #081428; color: #f3f6fa; cursor: pointer; --sp: #40c8f0;
  transition: opacity .7s cubic-bezier(.23, 1, .32, 1) .1s; }
#splash::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(55% 40% at 50% 46%, rgba(64, 200, 240, .13), transparent 70%); }
#splash.out { opacity: 0; pointer-events: none; }
.sp-in { position: relative; width: 100%; height: 220px; }
.sp-ring { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .1); border-top-color: var(--sp); border-right-color: var(--sp);
  animation: spSpin .9s cubic-bezier(.45, .05, .35, .95) infinite; transition: transform .32s cubic-bezier(.55, 0, 1, .45), opacity .32s ease-in; }
@keyframes spSpin { to { transform: rotate(360deg); } }
.sp-line { position: absolute; left: 50%; top: 50%; width: min(78vw, 300px); height: 4px; margin: -2px 0 0 calc(min(78vw, 300px) / -2); border-radius: 2px; background: var(--sp); box-shadow: 0 0 18px rgba(64, 200, 240, .55);
  transform: scaleX(0); opacity: 0; transition: transform .55s cubic-bezier(.65, 0, .35, 1) .3s, opacity .2s ease-out .3s, translate .6s cubic-bezier(.23, 1, .32, 1) .85s; }
.sp-word { position: absolute; left: 0; right: 0; top: 50%; height: 46px; margin-top: -48px; overflow: hidden; text-align: center; }
.sp-word b { display: block; font: 900 clamp(30px, 11vw, 44px)/46px var(--round); letter-spacing: .16em; padding-left: .16em; transform: translateY(105%); transition: transform .8s cubic-bezier(.23, 1, .32, 1) .85s; }
.sp-tag { position: absolute; left: 0; right: 0; top: 50%; margin-top: 18px; text-align: center; font: 800 16px/1 var(--round); color: var(--sp); letter-spacing: .62em; padding-left: .62em; opacity: 0; transform: translateY(6px); margin-top: 44px !important; transition: opacity .6s ease-out 1.35s, transform .6s cubic-bezier(.23, 1, .32, 1) 1.35s; }
.sp-badge { position: absolute; left: 50%; top: 50%; width: 78px; height: 78px; margin: -150px 0 0 -39px; border-radius: 50%; display: grid; place-items: center; background: rgba(64, 200, 240, .12); box-shadow: inset 0 0 0 2px var(--sp);
  opacity: 0; transform: scale(.4); transition: opacity .3s ease-out 1.1s, transform .7s cubic-bezier(.34, 1.56, .64, 1) 1.1s; }
.sp-badge b { font: 900 40px/1 var(--round); color: var(--sp); letter-spacing: -.02em; transform: translateX(1px); }
#splash.go .sp-ring { animation-play-state: paused; transform: scale(.15); opacity: 0; }
#splash.go .sp-line { transform: scaleX(1); opacity: 1; translate: 0 26px; }
#splash.go .sp-word b { transform: none; }
#splash.go .sp-tag { opacity: 1; transform: none; }
#splash.go .sp-badge { opacity: 1; transform: none; }
#splash.out .sp-in { transform: scale(1.04); transition: transform .8s cubic-bezier(.23, 1, .32, 1); }
@media (prefers-reduced-motion: reduce) {
  #splash *, #splash *::before { animation: none !important; transition-duration: .01s !important; transition-delay: 0s !important; }
}
.theme-wipe { position: fixed; z-index: 200; border-radius: 50%; pointer-events: none; will-change: transform, opacity; transform: scale(.01); }
.theming *, .theming *::before, .theming *::after { transition: none !important; }

/* программы и тренировка */
.sheet.tall { height: 94dvh; max-height: 94dvh; }
.mode-bar { display: inline-flex; align-items: center; gap: 4px; margin-top: calc(14px + env(safe-area-inset-top)); padding: 6px 12px 6px 8px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--acc-a); color: var(--acc); }

.no-ic { width: 36px; height: 36px; border-radius: 11px; background: var(--acc-a); color: var(--acc); }
.ex .mid { flex: 1; min-width: 0; } .ex .nm { font-weight: 600; letter-spacing: -.01em; } .ex .ds { font-size: 13px; color: var(--sec); margin-top: 1px; }
.wchip { font: 700 13px/1 var(--round); padding: 6px 9px; border-radius: 9px; background: var(--ok-a); color: var(--ok); white-space: nowrap; flex: none; }
.ex.in-ss { box-shadow: inset 3px 0 0 var(--acc); }
.xacts { display: flex; gap: 4px; flex: none; } .xacts button { width: 32px; height: 32px; border-radius: 10px; background: var(--card2); font-weight: 700; color: var(--sec); } .xacts button[disabled] { opacity: .3; }
.sslink { display: block; width: 100%; text-align: left; font-size: 12px; font-weight: 600; color: var(--ter); padding: 2px 14px 8px 54px; }
.sslink.on { color: var(--acc); }
.spark { width: 70px; height: 26px; flex: none; }
.rtop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

.rprog i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--acc2), var(--acc)); transition: width .5s var(--ease); }

.sdots { display: flex; gap: 6px; margin: 16px 0 6px; } .sdots i { flex: 1; height: 6px; border-radius: 3px; background: var(--bar); transition: background-color .3s; }

@keyframes breathe { 50% { opacity: .5; } }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stp { background: var(--card); border: 1px solid var(--sep); border-radius: 22px; padding: 12px; text-align: center; }

.rest circle { fill: none; stroke-width: 12; stroke-linecap: round; } .rest .tr { stroke: var(--bar); } .rest .pr { stroke: url(#rg2); transition: stroke-dashoffset .25s linear; }
.rest .big b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 56px/1 var(--round); letter-spacing: -.03em; }

.burst i { position: absolute; left: 50%; top: 58px; width: 8px; height: 8px; border-radius: 2px; background: var(--c); opacity: 0; animation: burst 1.1s var(--ease) .35s forwards; }

@media (hover: hover) and (pointer: fine) {
  /* блик на стекле идёт за курсором */

  .tabs .brand { display: flex; align-items: center; gap: 10px; font: 800 21px/1 var(--round); letter-spacing: -.02em; padding: 4px 10px 22px; }
  .tabs .brand i { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(145deg, var(--acc2), var(--acc)); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px -6px var(--acc-b); }

/* ---------- смена темы: цветная волна по компоненту transform, затем мягкое проявление ---------- */
function toggleTheme(btn) {
  userTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('forma.theme', userTheme); } catch (e) {}
  hap('t');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) { applyTheme(); return; }
  const r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, R = Math.ceil(Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)));
  const ov = document.createElement('div'); ov.className = 'theme-wipe';
  ov.style.cssText = `left:${x - R}px;top:${y - R}px;width:${2 * R}px;height:${2 * R}px;background:${userTheme === 'dark' ? '#080b10' : '#edf1f6'}`;
  document.body.appendChild(ov);
  ov.animate([{ transform: 'scale(.01)' }, { transform: 'scale(1)' }], { duration: 480, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'forwards' }).finished.then(() => {
    const root = document.documentElement; root.classList.add('theming'); applyTheme();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 360, easing: 'ease-out', fill: 'forwards' }).finished.then(() => { ov.remove(); root.classList.remove('theming'); });
    }));
  });
}

/* ---------- живой режим: данные на сервере тренера (Cloudflare Worker + D1) ---------- */
// Приложение открыто из бота (есть подпись Telegram) — работаем с сервером. Иначе или с ?demo=1 — демо с выдуманными данными.
const LIVE = !!(tg && tg.initData) && !/[?&]demo=1/.test(location.search);
let ROLE = 'demo', META = { bot: 'forma_demo_bot', trainer: 'Максим' };
const SYNC = { q: new Map(), t: 0, busy: false, warned: 0 };
const TRAINER = () => META.trainer || 'Тренер';
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'X-Init-Data': tg.initData }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || String(r.status)); e.code = j.error; throw e; }
  return j;
}
function snap() {        // снимок всех записей: ключ «вид|id» → JSON
  const m = new Map(), put = (k, id, v) => m.set(k + '|' + id, JSON.stringify(v));
  D.clients.forEach(c => put('c', c.id, c)); D.sess.forEach(x => put('s', x.id, x)); D.pay.forEach(x => put('p', x.id, x));
  (D.progs || []).forEach(x => put('g', x.id, x)); (D.logs || []).forEach(x => put('l', x.id, x));
  put('m', 'cnt', { key: 'cnt', seq: D.seq || 0, pid: D.pid || 0, cseq: D.cseq || 0 });
  return m;
}
function queueDiff(before, after) {   // на сервер уходят только изменившиеся записи
  const ok = k => ROLE !== 'client' || k.startsWith('l|');
  after.forEach((v, k) => { if (before.get(k) !== v && ok(k)) SYNC.q.set(k, { put: v }); });
  before.forEach((v, k) => { if (!after.has(k) && ok(k)) SYNC.q.set(k, { del: true }); });
  if (SYNC.q.size) { clearTimeout(SYNC.t); SYNC.t = setTimeout(flush, 350); }
}
async function flush() {
  if (SYNC.busy || !SYNC.q.size) return; SYNC.busy = true;
  const batch = [...SYNC.q.entries()].slice(0, 25);   // небольшими пачками: у бесплатного D1 не больше 50 запросов на один вызов
  batch.forEach(([k]) => SYNC.q.delete(k));
  const put = [], del = [];
  batch.forEach(([key, v]) => { const k = key[0], id = key.slice(2);
    if (v.del) del.push({ k, id }); else { const d = JSON.parse(v.put); put.push({ k, id, cid: k === 'c' ? d.id : d.cid != null ? d.cid : null, d }); } });
  try { await api('POST', '/api/sync', { put, del }); }
  catch (e) {
    batch.forEach(([k, v]) => { if (!SYNC.q.has(k)) SYNC.q.set(k, v); });
    if (Date.now() - SYNC.warned > 30000) { SYNC.warned = Date.now(); toast('Нет связи. Изменения сохранятся, когда появится интернет'); }
    setTimeout(flush, 4000);
  }
  SYNC.busy = false; if (SYNC.q.size) setTimeout(flush, 60);
}
function syncWait(title, doneMsg) {      // большой объём уходит на сервер пачками — показываем ход
  const all = SYNC.q.size || 1;
  open(() => `<div class="stitle">${title}…</div><div class="sub" id="swp">Отправлено 0%</div><div class="bar" style="margin-top:14px"><i id="swb" style="width:2%;animation:none"></i></div><div class="foot">Не закрывайте приложение, это займёт до минуты.</div>`);
  const t = setInterval(() => {
    const p = Math.round((1 - SYNC.q.size / all) * 100), a = $('#swp'), b = $('#swb');
    if (a) a.textContent = `Отправлено ${p}%`; if (b) b.style.width = Math.max(2, p) + '%';
    if (!SYNC.q.size && !SYNC.busy) { clearInterval(t); closeSheet(); hap('ok'); toast(doneMsg); refresh(); }
  }, 400);
  refresh();
}
function fromItems(items) {
  const d = { clients: [], byId: {}, sess: [], pay: [], progs: [], logs: [], seq: 0, pid: 0 };
  (items || []).forEach(({ k, d: x }) => {
    if (!x) return;
    if (k === 'c') { x.wt = x.wt || []; x.slots = x.slots || []; x.note = x.note || ''; x.inj = x.inj || ''; d.clients.push(x); d.byId[x.id] = x; }
    else if (k === 's') d.sess.push(x); else if (k === 'p') d.pay.push(x); else if (k === 'g') d.progs.push(x);
    else if (k === 'l') { x.ex = (Array.isArray(x.ex) ? x.ex : []).map(e => ({ ...e, n: String(e.n || ''), sets: (e.sets || []).map(q => ({ w: +q.w || 0, r: +q.r || 0 })) })); x.wi = +x.wi || 0; d.logs.push(x); }   // подходы — только числа
    else if (k === 'm' && x.key === 'cnt') { d.seq = x.seq || 0; d.pid = x.pid || 0; d.cseq = x.cseq || 0; }
  });
  d.sess.sort((a, b) => a.day - b.day || a.h * 60 + a.m - b.h * 60 - b.m);
  return d;
}
function fatal(title, text) { hideSplash(() => fatal2(title, text)); }
function fatal2(title, text) {
  document.body.classList.add('fatal');
  $$('.view').forEach(v => v.classList.remove('on')); const v = $('#v-today'); v.classList.add('on');
  v.innerHTML = `<div class="fatal-box"><div class="no-ic" style="width:64px;height:64px;border-radius:20px;margin:0 auto 16px">${ic('bolt', 30)}</div><div class="stitle">${title}</div><div class="sub" style="margin-top:8px">${text}</div></div>`;
}
async function reloadState() {   // подтянуть изменения из бота: подтверждения, переносы, подключения клиентов
  if (!LIVE || SYNC.q.size || SYNC.busy || sheetFn) return;
  try { const st = await api('GET', '/api/state'); if (SYNC.q.size) return; D = fromItems(st.items); refresh(); } catch (e) {}
}
async function bootLive() {
  $('#v-today').innerHTML = '<div class="fatal-box"><div class="spin"></div><div class="sub" style="margin-top:14px">Загружаю данные…</div></div>';
  let st;
  try { st = await api('GET', '/api/state'); }
  catch (e) { return fatal('Не удалось загрузить', e.code === 'auth' || e.message === '401' ? 'Откройте приложение заново из бота.' : 'Проверьте интернет и откройте приложение ещё раз.'); }
  META = Object.assign({}, META, st.meta || {}); ROLE = st.role;
  if (ROLE === 'none') return fatal('Вы ещё не подключены', 'Попросите у тренера личную ссылку-приглашение и откройте её в Telegram.');
  D = fromItems(st.items);
  if (ROLE === 'trainer') {
    if (!D.progs.length) { const b = snap(); D.progs = clone(PROGS0); queueDiff(b, snap()); }   // стартовые шаблоны программ
    mode = 'trainer'; buildNav(); badge(); tab = ''; hideSplash(() => show('today'));
  } else {
    meId = st.cid; mode = 'client'; document.body.classList.add('client-mode'); buildNav(); tab = ''; hideSplash(() => show('ctr'));
  }
}
const rndCode = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return [...a].map(b => (b % 36).toString(36)).join(''); };
function tgBlk(c) {
  return c.tg ? `<div class="blk"><h4>Telegram<span class="chip ok">подключён</span></h4><div class="kv" style="padding:0;align-items:center"><span>${esc(c.tgName || 'клиент')} · напоминания включены</span><button class="btn sm press" data-a="unlinkask" data-id="${c.id}">Отключить</button></div></div>`
    : `<div class="blk"><h4>Telegram<span class="chip">не подключён</span></h4><div class="sub" style="margin:0 0 10px">Пригласите клиента в бота: напоминания о тренировках будут приходить сами, а программу, подходы и прогресс он увидит в приложении.</div><button class="btn pri press" data-a="invite" data-id="${c.id}">${ic('plus')}Пригласить в бота</button></div>`;
}
const inviteLink = c => `https://t.me/${META.bot}?start=c_${c.inv}`;
const inviteText = c => `${first(c)}, добрый день! Подключитесь к моему боту: там напоминания о тренировках, ваша программа и прогресс. Откройте ссылку и нажмите «Старт»:`;
function sInvite(id) {
  const c = D.byId[id];
  return `<div class="stitle">Приглашение в бота</div><div class="sub">${esc(c.name)}</div>
  <div class="msg" style="margin-top:12px">${esc(inviteText(c))}\n${esc(inviteLink(c))}</div>
  <div class="btns"><button class="btn pri press" data-a="invshare" data-id="${id}">Отправить клиенту</button><button class="btn press" data-a="invcopy" data-id="${id}">Скопировать</button></div>
  <div class="foot">Ссылка личная, срабатывает один раз и действует 7 дней. Когда клиент нажмёт «Старт», вам придёт сообщение, а в карточке появится «подключён».${LIVE ? '' : ' В демо ссылка ненастоящая.'}</div>`;
}
const copyText = (tx, msg) => { const done = () => { hap('ok'); toast(msg); }; navigator.clipboard ? navigator.clipboard.writeText(tx).then(done, done) : done(); };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a, d = t.dataset;
  switch (a) {
    case 'invite': { const id = +d.id, c = D.byId[id]; if (!c.inv || (c.invAt && Date.now() - c.invAt > 6 * 864e5)) act('inv', { cid: id, code: rndCode(), at: Date.now() }); over(() => sInvite(id)); break; }
    case 'unlinkask': { const id = +d.id; over(() => `<div class="stitle">Отключить от бота?</div><div class="sub">${esc(D.byId[id].name)} · ${esc(D.byId[id].tgName || '')}</div>
      ${bullets(['Бот перестанет присылать этому человеку напоминания', 'Приложение для него закроется', 'Если ссылку переслали не тому — отключите и пригласите клиента заново'])}
      <div class="btns"><button class="btn bad wide press" data-a="unlink" data-id="${id}">Отключить</button></div>`); break; }
    case 'unlink': { const id = +d.id, done = () => { act('unlink', { cid: id }); hap('ok'); toast('Отключён от бота'); toClient(id); refresh(); };
      if (LIVE) api('POST', '/api/unlink', { cid: id }).then(done, () => toast('Нет связи, попробуйте ещё раз')); else done(); break; }
    case 'invcopy': { const c = D.byId[+d.id]; copyText(inviteText(c) + '\n' + inviteLink(c), 'Приглашение скопировано'); break; }
    case 'invshare': { const c = D.byId[+d.id], u = 'https://t.me/share/url?url=' + encodeURIComponent(inviteLink(c)) + '&text=' + encodeURIComponent(inviteText(c));
      try { tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u, '_blank'); } catch (er) { window.open(u, '_blank'); } break; }
    case 'tgsend': { const cid = +d.id, text = $('#msg').textContent;
      api('POST', '/api/send', { cid, text }).then(() => { hap('ok'); toast('Отправлено в Telegram'); }, er => toast(er.code === 'not_linked' ? 'Клиент ещё не подключён к боту' : 'Не удалось отправить')); break; }
  }
});

/* ---------- события ---------- */
const open = (fn, back) => openSheet(fn, back);
const over = fn => { const prev = sheetFn, pb = backFn; open(fn, prev ? () => open(prev, pb) : null); };   // «Назад» ведёт по всей цепочке   // открыть поверх текущей шторки, «Назад» вернёт её
const toClient = id => { tmp = {}; open(() => sClient(id)); };
function setStatus(id, s) {
  const x = D.sess.find(v => v.id === id), prev = x.st, c = D.byId[x.cid]; if (prev === s) return;
  act('st', { id, s }); hap(s === 'done' ? 'ok' : 't');
  const i = info(c), msg = s === 'done' ? (i.rem === 0 ? `Списано. Занятия закончились, предложите продление` : i.rem != null ? `Списано. Осталось ${i.rem}` : 'Отмечено') : s === 'cancel' ? 'Тренировка отменена' : s === 'miss' ? 'Отмечено: не пришёл' : 'Возвращено в план';
  toast(msg, () => { act('st', { id, s: prev }); refresh(); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a, d = t.dataset;
  if (t.tagName === 'A' && a === 'reset') e.preventDefault();
  if (a === 'quick') { e.stopPropagation(); const s = D.sess.find(v => v.id === d.id); justDone = s.st === 'done' ? null : d.id; setStatus(d.id, s.st === 'done' ? 'plan' : 'done'); refresh(); return; }
  switch (a) {
    case 'tab': closeSheet(); show(d.t); break;
    case 'sess': { const id = d.id; over(() => sSession(id)); break; }
    case 'client': { const id = +d.id; tmp = {}; over(() => sClient(id)); break; }
    case 'st': justDone = d.s === 'done' ? d.id : null; setStatus(d.id, d.s); closeSheet(); refresh(); break;
    case 'theme': toggleTheme(t); break;
    case 'week': { wk += +d.d; selDay = wk <= TODAY && TODAY < wk + 7 ? TODAY : wk; refresh(); const c = +d.d > 0 ? 'sr' : 'sl'; $$('#v-sch .days, #v-sch .list').forEach(x => x.classList.add(c)); break; }
    case 'day': { const c = +d.d > selDay ? 'sr' : 'sl', same = +d.d === selDay; selDay = +d.d; refresh(); if (!same) $('#v-sch .list').classList.add(c); break; }
    case 'flt': ff = d.f; $('#v-cl').classList.remove('calm'); drawCl(); break;
    case 'addsess': tmp = { day: d.day ? +d.day : TODAY, cid: d.cid ? +d.cid : null, t: d.t || null }; open(sAddSess, d.cid ? () => toClient(+d.cid) : null); break;
    case 'addcl': tmp = {}; open(sAddCl); break;
    case 'renew': { tmp = { k: D.byId[d.id].pkg.k }; const id = +d.id; over(() => sRenew(id)); break; }
    case 'kind': tmp.k = d.k; paintSheet(); break;
    case 'paid': tmp.paid = d.v === '1'; paintSheet(); break;
    case 'pday': tmp.day = +d.d; if ($('#scid')) tmp.cid = $('#scid').value; paintSheet(); break;
    case 'wd': { const i = tmp.wd.indexOf(+d.d); i < 0 ? tmp.wd.push(+d.d) : tmp.wd.length > 1 && tmp.wd.splice(i, 1); } paintSheet(); break;
    case 'dorenew': act('renew', { cid: +d.id, k: tmp.k, paid: tmp.paid }); hap('ok'); toast('Абонемент продлён'); tmp = {}; toClient(+d.id); refresh(); break;
    case 'pay': act('pay', { cid: +d.id }); hap('ok'); toast('Оплата принята'); refresh(); break;
    case 'remind': { const id = +d.id, tp = d.t, sid = d.sid || null; over(() => sRemind(id, tp, sid)); break; }
    case 'rswap': { const id = +d.id, tp = d.t, sid = d.sid || null; sheetFn = () => sRemind(id, tp, sid); paintSheet(); break; }
    case 'copy': { const tx = $('#msg').textContent, done = () => { hap('ok'); toast('Текст скопирован'); }; navigator.clipboard ? navigator.clipboard.writeText(tx).then(done, done) : done(); break; }
    case 'mvopen': { const id = d.id; tmp = {}; open(() => sMove(id), () => open(() => sSession(id))); break; }
    case 'domove': { const [h, m] = ($('#tmv').value || '18:00').split(':').map(Number); act('mv', { id: d.id, day: tmp.day, h, m }); hap('ok'); toast(`Перенесено на ${dayLabel(tmp.day).toLowerCase()}, ${tm(h, m)}`); closeSheet(); refresh(); break; }
    case 'doadd': { const [h, m] = ($('#tmv').value || '18:00').split(':').map(Number), cid = +$('#scid').value; act('add', { cid, day: tmp.day, h, m }); hap('ok'); toast('Тренировка добавлена'); selDay = tmp.day; wk = monday(tmp.day); closeSheet(); if (tab !== 'sch') show('sch'); else refresh(); break; }
    case 'donew': { const name = $('#nn').value.trim(); if (!name) { $('#nn').focus(); $('#nn').style.borderColor = 'var(--bad)'; break; } const [h, m] = ($('#tmv').value || '18:00').split(':').map(Number);
      act('newc', { name, phone: $('#np').value.trim() || '—', goal: $('#ng').value.trim() || 'Цель не указана', k: tmp.k, paid: tmp.paid, slots: tmp.wd.map(w => [w, h, m]) }); hap('ok'); toast('Клиент добавлен'); closeSheet(); tmp = {}; if (tab !== 'cl') show('cl'); else refresh(); break; }
    case 'wopen': { const id = +d.id; open(() => sWeight(id), () => toClient(id)); break; }
    case 'dow': { const v = parseFloat(String($('#wv').value).replace(',', '.')); if (!(v >= 20 && v <= 300)) { $('#wv').style.borderColor = 'var(--bad)'; break; } act('wt', { cid: +d.id, w: v }); hap('ok'); toast('Замер сохранён'); toClient(+d.id); refresh(); break; }
    case 'newany': open(() => `<div class="stitle">Добавить</div><div class="qa two" style="margin-top:14px"><button class="press" data-a="addsess">${ic('cal')}Тренировку</button><button class="press" data-a="addcl">${ic('plus')}Клиента</button></div>`); break;
    case 'attn': { const need = needList(), debt = ACT().filter(c => info(c).debt);
      openList('Требуют внимания', 'заканчивается абонемент или есть долг', () => cliRows([...new Set([...need, ...debt])], c => { const f = info(c); return [f.exp || f.low ? remText(c) : '', f.debt ? 'долг ' + rub(f.debt) : ''].filter(Boolean).join(' · '); })); break; }
    case 'rep': { const s = D.sess.find(x => x.id === d.id), day = s.day + 7; act('add', { cid: s.cid, day, h: s.h, m: s.m }); hap('ok'); toast(`Записано: ${dayLabel(day).toLowerCase()}, ${tm(s.h, s.m)}`); refresh(); break; }
    case 'demoloadask': over(() => `<div class="stitle">Заполнить примерами?</div><div class="sub">Для показа приложения клиентам-тренерам</div>
      ${bullets(['Добавятся 24 примерных клиента: тренировки за 3 месяца, оплаты за полгода, вес, программы', 'Ваши клиенты и их данные не изменятся', 'Бот примерам не пишет: у них нет Telegram', 'После показа: Клиенты → внизу «Убрать примеры клиентов»'])}

      ${bullets(['Удалятся только примеры: их тренировки, оплаты и записи', 'Ваши клиенты и их данные останутся'])}
      <div class="btns"><button class="btn bad wide press" data-a="democlear">Убрать примеры</button></div>`); break;
    case 'democlear': act('demoClear', {}); syncWait('Убираю примеры', 'Готово: примеры убраны'); break;
    case 'archask': { const id = +d.id; over(() => sArch(id)); break; }
    case 'doarch': { const id = +d.id, nm = D.byId[id].name; act('arch', { ids: [id] }); hap('ok'); closeSheet(); refresh(); toast(`${esc(nm)} в архиве`, () => { act('unarch', { ids: [id] }); refresh(); }); break; }
    case 'unarch': act('unarch', { ids: [+d.id] }); hap('ok'); toast('Клиент возвращён'); refresh(); break;
    case 'cdelask': { const id = +d.id; tmp = { sure: false }; over(() => sDel(id)); break; }
    case 'docdel': if (!tmp.sure) { tmp.sure = true; hap('t'); paintSheet(); break; } act('cdel', { cid: +d.id }); hap('ok'); closeSheet(); tmp = {}; refresh(); toast('Клиент удалён'); break;
    case 'barch': tmp = { sel: ACT().filter(c => passF(c, 'ghost') && info(c).idle >= 30).map(c => c.id) }; over(sBulk); break;
    case 'bsel': { const id = +d.id, i = tmp.sel.indexOf(id); i < 0 ? tmp.sel.push(id) : tmp.sel.splice(i, 1); hap('t'); paintSheet(); break; }
    case 'dobarch': { const ids = tmp.sel.slice(); if (!ids.length) break; act('arch', { ids }); hap('ok'); closeSheet(); tmp = {}; refresh(); toast(`В архиве: ${ids.length} ${plural(ids.length, 'клиент', 'клиента', 'клиентов')}`, () => { act('unarch', { ids }); refresh(); }); break; }
    case 'back': backFn && backFn(); break;
    case 'undo': { const u = $('#toast')._undo; $('#toast').classList.remove('on'); u && u(); break; }
    case 'reset': try { localStorage.removeItem(LOGKEY); } catch (er) {} location.reload(); break;
  }
});
document.addEventListener('focusout', e => { if (e.target.id === 'note') { const c = D.byId[e.target.dataset.id]; if (c && c.note !== e.target.value) act('note', { cid: c.id, t: e.target.value }); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetFn) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row[role=button]')) { e.preventDefault(); e.target.click(); }
});
scrim.addEventListener('click', closeSheet);
if (matchMedia('(hover: hover) and (pointer: fine)').matches) document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('.card, .list, .stat'); if (!el) return;
  const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });
let shownAt = Date.now();   // вернулись в приложение спустя минуту и больше — обновить «сейчас» и «через N мин»
document.addEventListener('visibilitychange', () => { if (document.hidden) shownAt = Date.now(); else if (LIVE) reloadState(); else if (Date.now() - shownAt > 6e4 && !sheetFn && !$('#toast').classList.contains('on')) refresh(); });

if (LIVE) bootLive();
else {
  buildNav(); init(); badge();
  const q = new URLSearchParams(location.search);
  if (q.get('tab') && VIEWS[q.get('tab')]) tab = q.get('tab');
  hideSplash(() => { show(tab); if (q.get('client')) toClient(+q.get('client')); });
}
})();
